<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar navbar-expand-lg bg-dark navbar-dark">

        <div class="container">

            <a href="#" class="navbar-brand">
                Shop
            </a>

            <button class="navbar-toggler"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="menu">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a href="#" class="nav-link">
                            Home
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="#" class="nav-link">
                            Product
                        </a>
                    </li>

                    <li class="nav-item">
                        <a href="#" class="nav-link">
                            Contact
                        </a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>

    <!-- CAROUSEL -->

    <div class="carousel slide"
        id="banner"
        data-bs-ride="carousel">

        <div class="carousel-inner">

            <div class="carousel-item active">

                <img src="https://picsum.photos/1200/500?1"
                    class="d-block w-100"
                    alt="">

            </div>

            <div class="carousel-item">

                <img src="https://picsum.photos/1200/500?2"
                    class="d-block w-100"
                    alt="">

            </div>

            <div class="carousel-item">

                <img src="https://picsum.photos/1200/500?3"
                    class="d-block w-100"
                    alt="">

            </div>

        </div>

    </div>

    <!-- PRODUCTS -->

    <div class="container py-5">

        <div class="row g-4">

            <!-- CARD -->

            <div class="col-12 col-md-6 col-lg-3">

                <div class="card">

                    <span class="badge bg-danger position-absolute m-2">
                        Sale
                    </span>

                    <img src="https://picsum.photos/300/200?11"
                        class="card-img-top"
                        alt="">

                    <div class="card-body">

                        <h5 class="card-title">
                            Product 1
                        </h5>

                        <p class="card-text">
                            Nice product
                        </p>

                        <button class="btn btn-primary"
                            data-bs-toggle="modal"
                            data-bs-target="#myModal">

                            Xem nhanh

                        </button>

                    </div>

                </div>

            </div>

            <!-- COPY -->

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card">
                    <img src="https://picsum.photos/300/200?12"
                        class="card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">Product 2</h5>
                        <p class="card-text">Nice product</p>
                        <button class="btn btn-primary">
                            Xem nhanh
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card">
                    <img src="https://picsum.photos/300/200?13"
                        class="card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">Product 3</h5>
                        <p class="card-text">Nice product</p>
                        <button class="btn btn-primary">
                            Xem nhanh
                        </button>
                    </div>
                </div>
            </div>

            <div class="col-12 col-md-6 col-lg-3">
                <div class="card">
                    <img src="https://picsum.photos/300/200?14"
                        class="card-img-top">
                    <div class="card-body">
                        <h5 class="card-title">Product 4</h5>
                        <p class="card-text">Nice product</p>
                        <button class="btn btn-primary">
                            Xem nhanh
                        </button>
                    </div>
                </div>
            </div>

        </div>

    </div>

    <!-- MODAL -->

    <div class="modal fade" id="myModal">

        <div class="modal-dialog">

            <div class="modal-content">

                <div class="modal-header">

                    <h5 class="modal-title">
                        Product Detail
                    </h5>

                    <button class="btn-close"
                        data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    Product information here

                </div>

            </div>

        </div>

    </div>

    <!-- FOOTER -->

    <footer class="bg-dark text-white p-5">

        <div class="container">

            <div class="row">

                <div class="col-md-3">
                    About
                </div>

                <div class="col-md-3">
                    Links
                </div>

                <div class="col-md-3">
                    Support
                </div>

                <div class="col-md-3">
                    Contact
                </div>

            </div>

        </div>

    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
