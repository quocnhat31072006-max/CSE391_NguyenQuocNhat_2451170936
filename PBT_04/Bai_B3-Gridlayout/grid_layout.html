<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <link rel="stylesheet" href="grid.css">
</head>

<body>

    <header>HEADER</header>

    <main>

        <section class="hero">
            HERO BANNER
        </section>

        <aside class="sidebar">
            <h3>Filters</h3>

            <label><input type="checkbox"> Shoes</label>
            <label><input type="checkbox"> Clothes</label>
            <label><input type="checkbox"> Phones</label>
        </aside>

        <section class="main-content">

            <article class="card">Card 1</article>
            <article class="card">Card 2</article>
            <article class="card">Card 3</article>
            <article class="card">Card 4</article>
            <article class="card">Card 5</article>
            <article class="card">Card 6</article>

        </section>

        <aside class="ads">
            ADS
        </aside>

    </main>

    <footer>
        FOOTER
    </footer>

</body>
</html>
