<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Validation Test</title>
  </head>

  <body>
    <form>
      <h3>Test Validation</h3>

      <!-- TH1 -->
      <p>1. Required (để trống)</p>
      <label for="test1">Required:</label>
      <input type="text" id="test1" required />

    <!-- TH2 -->
    <p>2. Email sai</p>
    <label for="test2">Email:</label>
    <input type="email" id="test2" value="abc">

    <!-- TH3 -->
    <p>3. Number > max</p>
    <label for="test3">Number:</label>
    <input type="number" id="test3" min="1" max="10" value="15">

      <!-- TH4 -->
      <p>4. Pattern sai</p>
      <label for="test4">Pattern:</label>
      <input type="text" id="test4" pattern="[0-9]{10}" value="abc123" />

      <!-- TH5 -->
      <p>5. Password ngắn</p>
      <label for="test5">Password:</label>
      <input type="password" id="test5" minlength="8" value="123" />

      <br /><br />
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
