<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Product Catalog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>Product Catalog</h1>

    <input id="search" placeholder="Search products...">

    <div class="controls">
        <button data-cat="all">All</button>
        <button data-cat="phone">Phone</button>
        <button data-cat="laptop">Laptop</button>
        <button data-cat="tablet">Tablet</button>
        <button data-cat="accessory">Accessory</button>

        <select id="sort">
            <option value="default">Sort</option>
            <option value="asc">Price ↑</option>
            <option value="desc">Price ↓</option>
            <option value="name">Name A-Z</option>
            <option value="rating">Rating</option>
        </select>

        <button id="darkMode">🌙</button>

        <div id="cart">🛒 <span id="badge">0</span></div>
    </div>
</header>

<main id="productList"></main>

<!-- Modal -->
<div id="modal" class="hidden">
    <div class="modal-content">
        <span id="close">❌</span>
        <div id="modalBody"></div>
    </div>
</div>

<script src="app.js"></script>

</body>
</html>
